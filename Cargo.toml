[package]
name = "tsumiki"
version = "0.1.0"
edition = "2024"

[dependencies]
tsumiki-protocol = { path = "crates/protocol" }
tsumiki-world = { path = "crates/world" }
tsumiki-net = { path = "crates/net" }
tsumiki-server = { path = "crates/server" }
tsumiki-client = { path = "crates/client" }
bevy_math = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[workspace]
members = ["crates/*"]
exclude = ["vendor/parley"]

[patch.crates-io]
parley = { path = "vendor/parley" }

[workspace.dependencies]
bevy_math = { version = "0.19", features = ["serialize"] }
serde = { version = "1", features = ["derive"] }
crossbeam-channel = "0.5"
noise = "0.9"
postcard = { version = "1.1", features = ["use-std"] }
serde_json = "1"
tempfile = "3"

# Fast iteration: light optimization for our code, full for dependencies
# (the standard Bevy dev-profile setup).
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
