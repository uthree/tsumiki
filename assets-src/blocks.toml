# Layer references compose deterministically: noise, palette swap, overlay.
# Faces default to XY tiling. Grass sides tile horizontally because their
# upper turf edge and lower soil edge intentionally serve different roles.
[layers.air]
kind = "noise"
style = "air"

[layers.stone]
kind = "noise"
style = "stone"
seed = 11
colors = ["stone.mid", "stone.shadow", "stone.light", "stone.high"]

[layers.dirt]
kind = "noise"
style = "dirt"
seed = 23
colors = ["brown.mid", "brown.shadow", "brown.light", "brown.high"]

[layers.grass]
kind = "noise"
style = "grass"
seed = 31
colors = ["green.mid", "green.shadow", "green.light", "green.high"]

[layers.grass_side]
kind = "overlay"
base = "dirt"
style = "grass_edge"
tiling = "x"

[layers.sand]
kind = "noise"
style = "sand"
seed = 43
colors = ["brown.high", "brown.light", "gold.high", "neutral.cream"]

[layers.water]
kind = "noise"
style = "water"
seed = 47
colors = ["blue.mid", "blue.shadow", "blue.light", "blue.high"]

[layers.bark]
kind = "noise"
style = "bark"
seed = 53
colors = ["brown.mid", "brown.shadow", "brown.light", "brown.high"]

[layers.log_end]
kind = "overlay"
base = "bark"
style = "log_end"

[layers.leaves]
kind = "noise"
style = "leaves"
seed = 61
colors = ["green.shadow", "green.mid", "green.light", "green.high"]

[layers.planks]
kind = "noise"
style = "planks"
seed = 71
colors = ["brown.light", "brown.mid", "brown.high", "gold.high"]

[layers.table_top]
kind = "overlay"
base = "planks"
style = "table_top"

[layers.table_side]
kind = "overlay"
base = "planks"
style = "table_side"

[layers.chest_top]
kind = "overlay"
base = "planks"
style = "chest_top"

[layers.chest_side]
kind = "overlay"
base = "planks"
style = "chest_side"

[layers.chest_front]
kind = "overlay"
base = "chest_side"
style = "chest_front"

[layers.cobble]
kind = "noise"
style = "cobble"
seed = 83
colors = ["stone.shadow", "stone.mid", "stone.light", "stone.high"]

[layers.coal_ore]
kind = "overlay"
base = "stone"
style = "ore"
colors = ["neutral.ink", "neutral.dim", "metal.shadow"]

[layers.iron_ore]
kind = "swap"
base = "coal_ore"
mapping = { "neutral.ink" = "red.shadow", "neutral.dim" = "gold.shadow", "metal.shadow" = "gold.mid" }

[layers.furnace_side]
kind = "overlay"
base = "stone"
style = "furnace_side"

[layers.furnace_top]
kind = "overlay"
base = "furnace_side"
style = "furnace_top"

[layers.furnace_front]
kind = "overlay"
base = "furnace_side"
style = "furnace_front"

[layers.torch]
kind = "overlay"
base = "sand"
style = "torch_glow"

[layers.demo_red_light]
kind = "overlay"
base = "furnace_side"
style = "lamp"
ramp = "red"

[layers.demo_green_light]
kind = "overlay"
base = "furnace_side"
style = "lamp"
ramp = "green"

[layers.demo_blue_light]
kind = "overlay"
base = "furnace_side"
style = "lamp"
ramp = "blue"

[layers.farmland]
kind = "overlay"
base = "dirt"
style = "furrows"

[layers.wheat_young]
kind = "overlay"
base = "air"
style = "crop"
mature = false
tiling = ""

[layers.wheat_mature]
kind = "overlay"
base = "air"
style = "crop"
mature = true
tiling = ""

[layers.machine_side]
kind = "overlay"
base = "furnace_side"
style = "machine_side"

[layers.miner_top]
kind = "overlay"
base = "machine_side"
style = "miner_top"

[layers.miner_front]
kind = "overlay"
base = "machine_side"
style = "miner_front"

[layers.belt_side]
kind = "overlay"
base = "machine_side"
style = "belt_side"

[layers.belt_top]
kind = "overlay"
base = "machine_side"
style = "belt_top"

[layers.powered_furnace_front]
kind = "overlay"
base = "machine_side"
style = "powered_furnace_front"

[layers.factory_storage_front]
kind = "overlay"
base = "machine_side"
style = "factory_storage_front"

[layers.solar_top]
kind = "overlay"
base = "machine_side"
style = "solar_top"

