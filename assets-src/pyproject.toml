[project]
name = "tsumiki-assets"
version = "0.1.0"
description = "Deterministic palette-based block textures and inventory icons"
requires-python = ">=3.12"
dependencies = ["pillow==12.3.0"]

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
