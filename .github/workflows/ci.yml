name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        run: |
          python3 -m venv "$RUNNER_TEMP/asset-tools"
          "$RUNNER_TEMP/asset-tools/bin/pip" install uv
          echo "$RUNNER_TEMP/asset-tools/bin" >> "$GITHUB_PATH"
      - name: Install asset dependencies
        run: uv sync --project assets-src --locked --python 3.12
      - name: Check generated assets
        run: uv run --project assets-src python assets-src/generate.py --check
      - name: Asset tests
        run: uv run --project assets-src pytest assets-src/tests
      - name: Asset code quality
        run: |
          uv run --project assets-src ruff check assets-src
          uv run --project assets-src ruff format --check assets-src
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Bevy system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace
